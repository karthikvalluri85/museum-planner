# Weekly dependency updates, kept quiet on purpose.
#
# Requirements here are ranges (for example "fastapi>=0.111,<1"), so a new release
# inside the range needs no change. increase-if-necessary leaves those alone and
# only proposes a change when a release falls outside the range. Whatever is left
# is grouped into one pull request per ecosystem and directory.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/planner
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      planner-python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /services/ingestion-job
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 2
    groups:
      ingestion-python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]
