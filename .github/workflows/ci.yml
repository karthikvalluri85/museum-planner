name: ci

# Contract gate plus both test suites. No cloud credentials needed.
# UNTESTED: written before a GitHub repository existed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tooling self-tests
        run: node tools/selftest.mjs
      - name: Contract gate (schemas, examples, circular refs, service catalog, docs in sync)
        run: node tools/validate-contracts.mjs
      - name: Floor graphs
        run: node tools/validate-contracts.mjs --graph services/ingestion-job/seed/floor_graphs/*.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Independent OpenAPI 3.1 validation
        run: |
          pip install --quiet "openapi-spec-validator>=0.7,<1"
          openapi-spec-validator contracts/planner/openapi.yaml

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [planner, ingestion-job]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install --quiet -r requirements-dev.txt
      - run: pytest -q

  integration:
    # Ingest the bundled fixtures into a file store, serve them with the planner,
    # and check real responses against the contract. No emulators needed.
    runs-on: ubuntu-latest
    needs: [contracts, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r services/ingestion-job/requirements.txt -r services/planner/requirements.txt
      - name: Offline integration audit
        run: bash tools/integration-audit.sh

  images:
    runs-on: ubuntu-latest
    needs: [tests]
    strategy:
      matrix:
        service: [planner, ingestion-job]
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t museum-planner/${{ matrix.service }}:ci services/${{ matrix.service }}
