# Contract: planner service HTTP API.
# Style rule for this file: block YAML only, double-quoted strings wherever a
# value contains punctuation. tools/validate-contracts.mjs parses this subset
# with zero dependencies so the lint gate runs on a bare machine.
openapi: 3.1.0
info:
  title: Museum Planner API
  version: 1.0.0
  summary: "Builds a museum visit plan from interests, time, and what the visitor's body can do that day."
  description: "Stateless. Replanning is another POST /api/plan carrying the visitor's current gallery and the objects already seen."
  license:
    name: MIT
    identifier: MIT
servers:
  - url: "http://localhost:8080"
    description: "Local (docker compose or uvicorn)"
  - url: "https://planner-284069478679.us-central1.run.app"
    description: "Cloud Run, us-central1. Offline since 2026-11-14."
tags:
  - name: ops
  - name: museums
  - name: planning
paths:
  /health:
    get:
      operationId: getHealth
      tags: [ops]
      summary: "Liveness probe. Does not touch Firestore."
      responses:
        "200":
          description: "Service is up."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/museums:
    get:
      operationId: listMuseums
      tags: [museums]
      summary: "Museums that have been ingested and have a floor graph."
      responses:
        "200":
          description: "Plannable museums."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuseumList"
        "503":
          description: "Museum data could not be read from the store. Safe to retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/museums/{museum_id}:
    get:
      operationId: getMuseum
      tags: [museums]
      summary: "One museum with interest facets, wings, and floor-data provenance."
      parameters:
        - $ref: "#/components/parameters/MuseumId"
      responses:
        "200":
          description: "Museum detail."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuseumDetail"
        "404":
          description: "Unknown museum."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Museum data could not be read from the store. Safe to retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/plan:
    post:
      operationId: createPlan
      tags: [planning]
      summary: "Build a plan, or rebuild the rest of one from the current gallery."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: "A plan, or an explicit statement that none exists plus the best alternative."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResponse"
        "404":
          description: "Unknown museum."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "Request failed validation, or current_gallery is not in the floor graph."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "A plan failed its own integrity check (invariants I1 to I3) and was withheld rather than returned."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: "Museum data could not be read from the store. Safe to retry."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  parameters:
    MuseumId:
      name: museum_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MuseumIdValue"
  schemas:
    MuseumIdValue:
      type: string
      pattern: "^[a-z][a-z0-9-]{1,30}$"
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              enum: [museum_not_found, invalid_request, unknown_gallery, store_unavailable, internal_error]
            message:
              type: string
              minLength: 1
            details:
              type: array
              items:
                type: string
    MuseumSummary:
      type: object
      additionalProperties: false
      required: [id, name, city, object_count, last_ingested_at]
      properties:
        id:
          $ref: "#/components/schemas/MuseumIdValue"
        name:
          type: string
          minLength: 1
        city:
          type: string
        object_count:
          type: integer
          minimum: 0
          description: "Objects that have a gallery in the source data and are therefore plannable."
        last_ingested_at:
          type: string
          format: date-time
    MuseumList:
      type: object
      additionalProperties: false
      required: [museums]
      properties:
        museums:
          type: array
          items:
            $ref: "#/components/schemas/MuseumSummary"
    Facet:
      type: object
      additionalProperties: false
      required: [tag, label, count]
      properties:
        tag:
          type: string
          minLength: 1
          description: "Lowercase tag. Send this value in PlanRequest.interests."
        label:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 1
    FloorData:
      type: object
      additionalProperties: false
      required: [verification_status, source]
      properties:
        verification_status:
          enum: [unverified, partially_verified, verified]
          description: "Whether a person has checked the hand-built floor graph against the museum's published plan."
        source:
          type: string
          minLength: 1
        notes:
          type: [string, "null"]
    MuseumDetail:
      type: object
      additionalProperties: false
      required: [id, name, city, object_count, last_ingested_at, facets, wings, data_notice, floor_data]
      properties:
        id:
          $ref: "#/components/schemas/MuseumIdValue"
        name:
          type: string
          minLength: 1
        city:
          type: string
        object_count:
          type: integer
          minimum: 0
        last_ingested_at:
          type: string
          format: date-time
        facets:
          type: array
          items:
            $ref: "#/components/schemas/Facet"
        wings:
          type: array
          items:
            type: string
            minLength: 1
        data_notice:
          type: string
          minLength: 20
          description: "States that the plan is built from public data and the museum has not reviewed it."
        floor_data:
          $ref: "#/components/schemas/FloorData"
    Constraints:
      type: object
      additionalProperties: false
      properties:
        step_free:
          type: boolean
          default: false
          description: "Route may only use edges marked step_free in the floor graph."
        limited_stamina:
          type: boolean
          default: false
          description: "Cap total walking minutes and insert rest stops at nodes with seating."
        max_walking_minutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 120
          default: null
          description: "Walking cap when limited_stamina is true. Server default is 15."
        with_young_child:
          type: boolean
          default: false
          description: "Short dwell times, favor large objects, end near restrooms and the cafe."
        low_sensory:
          type: boolean
          default: false
          description: "Never stop in a node tagged loud, bright, or crowded. Route around such nodes where the floor graph allows; where it does not, pass through and name each one in plan.warnings."
        short_visit:
          type: boolean
          default: false
          description: "Stay in a single wing. The server also applies this when time_budget_minutes is 60 or less."
    PlanRequest:
      type: object
      additionalProperties: false
      required: [museum_id, time_budget_minutes]
      properties:
        museum_id:
          $ref: "#/components/schemas/MuseumIdValue"
        interests:
          type: array
          maxItems: 12
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 60
          description: "Facet tags or free words. Empty means: use the museum's highlights."
        time_budget_minutes:
          type: integer
          minimum: 15
          maximum: 240
        constraints:
          $ref: "#/components/schemas/Constraints"
        current_gallery:
          type: [string, "null"]
          default: null
          description: "Gallery the visitor is standing in. Null means start at the museum entrance. Set this to replan."
        exclude_object_ids:
          type: array
          maxItems: 300
          default: []
          items:
            type: string
          description: "Objects already seen or rejected. Never returned again."
        skip_wings:
          type: array
          maxItems: 30
          default: []
          items:
            type: string
          description: "Wings to leave out of the plan (the skip-this-wing button)."
    Segment:
      type: object
      additionalProperties: false
      required: [from_node_id, to_node_id, from_name, to_name, walk_minutes, step_free, kind, name]
      properties:
        from_node_id:
          type: string
        to_node_id:
          type: string
        from_name:
          type: string
        to_name:
          type: string
        walk_minutes:
          type: number
          exclusiveMinimum: 0
        step_free:
          type: boolean
        kind:
          enum: [level, ramp, elevator, stairs, escalator]
        name:
          type: [string, "null"]
          description: "Name of the stairs, elevator, or ramp. Never null when step_free is false."
    StairsUse:
      type: object
      additionalProperties: false
      required: [name, kind, from_node_id, to_node_id, from_name, to_name]
      properties:
        name:
          type: string
          minLength: 1
        kind:
          enum: [level, ramp, elevator, stairs, escalator]
        from_node_id:
          type: string
        to_node_id:
          type: string
        from_name:
          type: string
        to_name:
          type: string
    PlanObject:
      type: object
      additionalProperties: false
      required: [id, title, artist, date, image_url, source_url, tags, size_class, is_highlight]
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 1
        artist:
          type: [string, "null"]
        date:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        source_url:
          type: [string, "null"]
        tags:
          type: array
          items:
            type: string
        size_class:
          enum: [small, medium, large, monumental]
        is_highlight:
          type: boolean
    Grounding:
      type: object
      additionalProperties: false
      required: [matched_tags, fields]
      properties:
        matched_tags:
          type: array
          items:
            type: string
          description: "Object tags that matched the visitor's interests. Always a subset of the object's tags."
        fields:
          type: array
          minItems: 1
          items:
            type: string
          description: "Data fields the why sentence was built from, for example object.tags or node.has_seating."
    Stop:
      type: object
      additionalProperties: false
      required: [order, kind, gallery, node_id, node_name, floor, wing, object, why, grounding, dwell_minutes, walk_minutes_to_next, route_to_next]
      properties:
        order:
          type: integer
          minimum: 1
        kind:
          enum: [object, rest, amenity]
        gallery:
          type: [string, "null"]
          description: "Gallery number exactly as it appears in the museum's data. Never synthesized."
        node_id:
          type: string
        node_name:
          type: string
        floor:
          type: string
        wing:
          type: string
        object:
          anyOf:
            - $ref: "#/components/schemas/PlanObject"
            - type: "null"
        why:
          type: string
          minLength: 10
          description: "One sentence. Built only from the fields listed in grounding."
        grounding:
          $ref: "#/components/schemas/Grounding"
        dwell_minutes:
          type: integer
          minimum: 1
        walk_minutes_to_next:
          type: [number, "null"]
          minimum: 0
          description: "Null on the last stop."
        route_to_next:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
      if:
        required: [kind]
        properties:
          kind:
            const: object
      then:
        properties:
          gallery:
            type: string
            minLength: 1
          object:
            $ref: "#/components/schemas/PlanObject"
    PlanStart:
      type: object
      additionalProperties: false
      required: [node_id, node_name, walk_minutes_to_first, route_to_first]
      properties:
        node_id:
          type: string
        node_name:
          type: string
        walk_minutes_to_first:
          type: number
          minimum: 0
        route_to_first:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    Totals:
      type: object
      additionalProperties: false
      required: [dwell_minutes, walking_minutes, total_minutes, time_budget_minutes]
      properties:
        dwell_minutes:
          type: integer
          minimum: 0
        walking_minutes:
          type: number
          minimum: 0
        total_minutes:
          type: number
          minimum: 0
        time_budget_minutes:
          type: integer
          minimum: 15
    Plan:
      type: object
      additionalProperties: false
      required: [start, stops, totals, step_free, stairs, wings, warnings]
      properties:
        start:
          $ref: "#/components/schemas/PlanStart"
        stops:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Stop"
        totals:
          $ref: "#/components/schemas/Totals"
        step_free:
          type: boolean
          description: "True only if every segment in start.route_to_first and every stop's route_to_next is step_free."
        stairs:
          type: array
          items:
            $ref: "#/components/schemas/StairsUse"
          description: "Every non-step-free segment the plan uses, by name. Empty when step_free is true."
        wings:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
    Applied:
      type: object
      additionalProperties: false
      required: [constraints, interests_matched, interests_unmatched, notes]
      properties:
        constraints:
          $ref: "#/components/schemas/Constraints"
        interests_matched:
          type: array
          items:
            type: string
        interests_unmatched:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
          description: "One plain sentence per constraint in force, saying what it did to this plan. Built from the plan and the floor graph, never from the request alone."
    PlanResponse:
      type: object
      additionalProperties: false
      required: [status, museum, plan, alternative, message, applied, notices]
      properties:
        status:
          enum: [ok, no_step_free_route, no_plannable_objects]
          description: "ok means plan is set. no_step_free_route means plan is null and alternative names the stairs it needs. no_plannable_objects means both are null."
        museum:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id:
              $ref: "#/components/schemas/MuseumIdValue"
            name:
              type: string
        plan:
          anyOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
        alternative:
          anyOf:
            - $ref: "#/components/schemas/Plan"
            - type: "null"
        message:
          type: [string, "null"]
          description: "Plain-language explanation whenever status is not ok."
        applied:
          $ref: "#/components/schemas/Applied"
        notices:
          type: array
          minItems: 1
          items:
            type: string
          description: "Always includes the public-data notice and the floor-data verification status."
